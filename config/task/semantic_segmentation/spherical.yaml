%YAML 1.2
---
# ──────────────────────────────────────────────────────────────────────
# Spherical Semantic Segmentation Architecture
# ──────────────────────────────────────────────────────────────────────
# Backbone operating on spherical signals (S^2) for dense per-pixel
# classification.  Supports DeepLabV3, YOLOv11, and UNet backbones.
# Uses geodesic convolutions via GenericSphericalConv.
# ──────────────────────────────────────────────────────────────────────

_target_: usf.network.model.semantic_segmentation.SphericalSemanticSegmentation
model_type: Spherical          # experiment display name
backbone: DeepLabV3            # backbone architecture: YOLOv11 | UNet | DeepLabV3

# ── Network Architecture ─────────────────────────────────────────────
num_categories: 14             # number of Stanford 2D-3D-S semantic classes
in_channels: 3                 # input channels (RGB = 3)
base_channel: 64               # channel basis; deeper layers scale as base_channel x 2^k
activation: ReLU               # activation function for all layers
expansion: 0.5                 # bottleneck expansion ratio: hidden_channels = in_channels x expansion

# ── Spherical Convolution Settings ───────────────────────────────────
backend: circle                # spherical conv backend: circle | ripple | spherical | wave
location_sampler: icosahedron  # tessellation for output pixel locations in all bottom-level spherical layers
reject_oo_fov_vector: true     # mask out-of-FoV vectors (true for non-panoramic input)
resolution_factor: 0.25        # output pixels ~ input pixels x resolution_factor per downsample layer
block_size: 16384              # chunk size for pairwise distance / collection-matrix construction

# Weighting function: maps geodesic quantities -> per-edge convolution weights.
weighting_function_config:
    distance:
        # ── Continuous (MLP-based) ──
        # function: continuous
        # activation: ReLU
        # hidden_dims: [4, 4]
        # embedding:
        #     type: cosine
        #     L: 3
        # ── Discrete (lookup table) ──
        function: discrete
        num_slices: 3          # number of distance bins
    # direction:               # uncomment for direction-aware kernels
    #     function: discrete
    #     num_slices: 3

# ── Input Resampler ──────────────────────────────────────────────────
resampler_config:
    location_sampler: icosahedron
    value_sampler: radial_basis_function
    value_sampler_config:
        num_in_circle_points: 4
        kernel: gaussian
        sigma: 0.2
        block_size: 16384
    reject_oo_fov_value: true
    output_average_pixel_area: 2.727076956241019e-05

# ── Attention (PSA) Settings ─────────────────────────────────────────
num_psa: 2                             # number of PSA attention blocks inside C2PSA at the deep neck
attention_backend: xformers            # attention implementation: xformers | flex attention | plain
