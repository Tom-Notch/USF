%YAML 1.2
---
# Sensor Type: 0: IMU; 1: Non-depth Camera; 2: Depth Camera; 3: LiDAR
sensor_type: 1
image_width: 612
image_height: 514

# Sensing Modality: 0: RGB; 1: thermal
sensing_modality: 0

# Optional mask
mask: ./masks/rgb_2_mask.png

# Lens Normal Map, use npz for best precision
lens_normal_map: ./lens_normal_maps/rgb_2_lens_normal_map.npy

# Intrinsic
intrinsic:
    # Camera Model Type: 0: Pinhole; 1: Mei (Fisheye)
    model_type: 1
    mirror_parameters:
        xi: 1.7139246620368456
    distortion_parameters: # radial-tangential distortion
        k1: -0.13073923484299074
        k2: 0.10307842565779989
        p1: 0.0006344381381393967
        p2: -0.0005062618224910029
    projection_parameters:
        gamma1: 397.810744937
        gamma2: 399.165194095
        u0: 305.095546854
        v0: 252.129256452
