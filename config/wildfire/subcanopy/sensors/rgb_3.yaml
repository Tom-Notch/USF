%YAML 1.2
---
# Sensor Type: 0: IMU; 1: Non-depth Camera; 2: Depth Camera; 3: LiDAR
sensor_type: 1
image_width: 612
image_height: 514

# Sensing Modality: 0: RGB; 1: thermal
sensing_modality: 0

# Optional mask
mask: ./masks/rgb_3_mask.png

# Lens Normal Map, use npz for best precision
lens_normal_map: ./lens_normal_maps/rgb_3_lens_normal_map.npy

# Intrinsic
intrinsic:
    # Camera Model Type: 0: Pinhole; 1: Mei (Fisheye)
    model_type: 1
    mirror_parameters:
        xi: 1.8006826112182732
    distortion_parameters: # radial-tangential distortion
        k1: -0.10944879981202416
        k2: 0.18731241520628844
        p1: -9.589489461815805e-05
        p2: -0.0006417113954911321
    projection_parameters:
        gamma1: 413.427214267
        gamma2: 415.092440566
        u0: 311.2099755
        v0: 249.861427018
