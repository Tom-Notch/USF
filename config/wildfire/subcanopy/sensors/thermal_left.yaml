%YAML 1.2
---
# Sensor Type: 0: IMU; 1: Non-depth Camera; 2: Depth Camera; 3: LiDAR
sensor_type: 1
image_width: 640
image_height: 512

# Sensing Modality: 0: RGB; 1: thermal
sensing_modality: 1

# # Optional mask
# mask: ./masks/test_mask_640x480.png

# Lens Normal Map, use npz for best precision
lens_normal_map: ./lens_normal_maps/thermal_left_lens_normal_map.npy

# Intrinsic
intrinsic:
    # Camera Model Type: 0: Pinhole; 1: Mei (Fisheye)
    model_type: 0
    distortion_parameters: # radial-tangential distortion
        k1: -0.36630643
        k2: 0.12521998
        p1: 0.00193871
        p2: -0.00012379
    projection_parameters:
        fx: 408.47423241
        fy: 408.78040979
        cx: 311.83170583
        cy: 250.25558975
