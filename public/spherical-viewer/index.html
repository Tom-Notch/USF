<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>USF Spherical Image Viewer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #usf-viewer-root {
        width: 100%;
        height: 100%;
        min-height: 280px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .usf-viewer-error {
        box-sizing: border-box;
        padding: 1rem 1.25rem;
        max-width: 42rem;
        margin: 2rem auto;
        line-height: 1.5;
        color: #1d1d1f;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      }
      .usf-viewer-spinner {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .usf-maximize-btn {
        position: absolute;
        bottom: 8px;
        right: 8px;
        z-index: 20;
        width: 32px;
        height: 32px;
        padding: 0;
        border: none;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.35);
        color: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition:
          opacity 0.25s,
          background 0.2s;
        pointer-events: auto;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }
      @media (hover: none) {
        .usf-maximize-btn {
          opacity: 0.5;
        }
      }
      @media (hover: hover) {
        #usf-viewer-root:hover .usf-maximize-btn {
          opacity: 0.7;
        }
        .usf-maximize-btn:hover {
          opacity: 1 !important;
          background: rgba(0, 0, 0, 0.55);
        }
      }
      #usf-viewer-root.usf-maximized .usf-maximize-btn {
        opacity: 0.7;
      }
      #usf-viewer-root.usf-maximized {
        position: fixed !important;
        inset: 12px !important;
        width: calc(100% - 24px) !important;
        height: calc(100% - 24px) !important;
        z-index: 999999 !important;
        border-radius: 16px !important;
      }
      .usf-maximize-btn svg {
        width: 18px;
        height: 18px;
      }
      .usf-interaction-hint {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 64px;
        height: 88px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.4s;
        z-index: 10;
      }
      .usf-interaction-hint.visible {
        opacity: 1;
      }
      .usf-hint-hand-wrap {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.35s ease;
      }
      .usf-interaction-hint.visible .usf-hint-hand-wrap {
        opacity: 1;
      }
      .usf-hint-hand--pan {
        width: 50px;
        height: 72px;
        transform: translateX(0) scale(1.16);
        transform-origin: center center;
        /* forwards: avoid snap to scale(1) when non-infinite animation ends */
        animation: usf-swipe 2.4s ease-in-out forwards;
      }
      @keyframes usf-swipe {
        0%,
        100% {
          transform: translateX(0) scale(1.16);
        }
        30% {
          transform: translateX(26px) scale(1.16);
        }
        60% {
          transform: translateX(-26px) scale(1.16);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .usf-hint-hand--pan {
          animation: none !important;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.2/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="usf-viewer-root"></div>
    <script type="module" src="./viewer.js"></script>
  </body>
</html>
